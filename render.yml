name: Render reel
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: python3 tools/build.py
      - run: npm install
      - run: npm run render
      - uses: actions/upload-artifact@v4
        with:
          name: reel
          path: out/reel.mp4
